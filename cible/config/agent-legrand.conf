
<!-- ===== Ajouts Legrand SOC ===== -->
<ossec_config>
  <localfile>
    <log_format>apache</log_format>
    <location>/var/log/apache2/access.log</location>
  </localfile>
  <localfile>
    <log_format>apache</log_format>
    <location>/var/log/apache2/error.log</location>
  </localfile>
  <localfile>
    <log_format>json</log_format>
    <location>/var/log/legrand/app.log</location>
  </localfile>
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/auth.log</location>
  </localfile>

  <!-- Surveillance de l'intégrité : détection de dépôt de webshell (temps réel) -->
  <syscheck>
    <directories realtime="yes" check_all="yes" report_changes="yes">/var/www/html</directories>
    <directories check_all="yes">/etc/sudoers,/etc/sudoers.d,/etc/passwd,/etc/group</directories>
  </syscheck>

  <!-- Réponse active : le manager peut bloquer une IP sur cette machine -->
  <active-response>
    <disabled>no</disabled>
  </active-response>
</ossec_config>
